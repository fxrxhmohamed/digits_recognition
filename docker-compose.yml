version: '3.8'
services:
  api:
    build: .
    command: poetry run uvicorn src.digits_recognition.server.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/user/local/app
    restart: unless-stopped
  ui:
    build: .
    command: poetry run streamlit run src/digits_recognition/ui/ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/user/local/app
    restart: unless-stopped
